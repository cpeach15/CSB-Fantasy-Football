name: Update the site

on:
  schedule:
    - cron: '0 11 * * 2'   # Tuesday 11:00 UTC (early morning in the US): after Monday Night Football
    - cron: '0 20 * * 4'   # Thursday 20:00 UTC: fresh projections and picks before kickoff
  workflow_dispatch:       # "Run workflow" button for a refresh any time
    inputs:
      test_alert:
        description: Also send a test message to Slack (only if you set up Slack alerts)
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:  # read by the deploy and alert jobs
      ready: ${{ steps.setup.outputs.ready }}
      pages: ${{ steps.pages.outcome }}
      espn: ${{ steps.espn.outcome }}
      bets: ${{ steps.bets.outcome }}
      compute: ${{ steps.compute.outcome }}
      card: ${{ steps.card.outcome }}
      page: ${{ steps.page.outcome }}
      save: ${{ steps.save.outcome }}
      name: ${{ steps.page.outputs.name }}
      alerts: ${{ steps.alerts.outputs.text }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the league is set up
        id: setup
        run: |
          if grep -Eq '^espn_league_id:[[:space:]]*[0-9]+' settings.txt; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not set up yet. Open the Actions tab, pick 'Set up my league' and click Run workflow."
          fi

      - name: Find the site's address (needs GitHub Pages turned on)
        id: pages
        if: steps.setup.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v6
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - name: Pull league data from ESPN
        id: espn
        if: steps.setup.outputs.ready == 'true'
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}   # only needed for a private league
          SWID: ${{ secrets.SWID }}
        run: node scripts/fetch.js data/league.json

      - name: Pull the weekly bet doc (if there is one)
        id: bets
        if: steps.setup.outputs.ready == 'true'
        run: python3 scripts/bets.py

      - name: Compute stats
        id: compute
        if: steps.setup.outputs.ready == 'true'
        run: python3 scripts/compute.py data/league.json build/results.json

      - name: Draw the link-preview card and icons
        id: card
        if: steps.setup.outputs.ready == 'true'
        continue-on-error: true   # the page still builds (without a preview image) if this fails
        run: |
          python -m pip install --quiet pillow
          python scripts/og.py build/results.json _site

      - name: Build the page
        id: page
        if: steps.setup.outputs.ready == 'true'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/build.py build/results.json _site/index.html
          echo "name=$(python3 -c "import json;print(json.load(open('build/results.json'))['site']['name'])")" >> "$GITHUB_OUTPUT"
          echo "The site: ${{ steps.pages.outputs.base_url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the data snapshot
        id: save
        if: steps.setup.outputs.ready == 'true' && github.event_name != 'push'
        run: |
          git config user.name "hall of fame bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v5
        if: steps.setup.outputs.ready == 'true'
        with:
          path: _site

      - name: Collect anything worth flagging
        id: alerts
        if: always()
        run: |
          if [ "${{ steps.card.outcome }}" = failure ]; then
            mkdir -p build && echo "The link-preview card didn't draw this time, so the site went out without it." >> build/alerts.txt
          fi
          { echo 'text<<END_OF_ALERTS'; cat build/alerts.txt 2>/dev/null || true; echo 'END_OF_ALERTS'; } >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  alert:  # posts to Slack when something breaks (only if the SLACK_WEBHOOK_URL secret is set)
    needs: [build, deploy]
    if: always() && needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tell Slack about problems
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_NAME: ${{ needs.build.outputs.name }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          STEP_PAGES: ${{ needs.build.outputs.pages }}
          STEP_ESPN: ${{ needs.build.outputs.espn }}
          STEP_BETS: ${{ needs.build.outputs.bets }}
          STEP_COMPUTE: ${{ needs.build.outputs.compute }}
          STEP_PAGE: ${{ needs.build.outputs.page }}
          STEP_SAVE: ${{ needs.build.outputs.save }}
          ALERTS: ${{ needs.build.outputs.alerts }}
          TEST_ALERT: ${{ inputs.test_alert }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify.py
